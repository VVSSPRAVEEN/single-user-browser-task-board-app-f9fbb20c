name: Testomatio manual test run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-manual-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@4a1ef87a9e29a2d1e7ebf42b2512a29298b70b40
      - name: Serve single-file app
        run: |
          python -m http.server 8000 --directory . &
          sleep 2
      - name: Run manual acceptance checklist
        run: |
          echo "Manual acceptance checklist: tests/manual_acceptance_checklist.md"
          echo "Open http://localhost:8000 and run each checklist item at 360px and desktop viewports."
          cat tests/manual_acceptance_checklist.md
      - name: Verify index.html loads
        run: |
          curl -sSf http://localhost:8000/index.html | head -c 200
          echo
